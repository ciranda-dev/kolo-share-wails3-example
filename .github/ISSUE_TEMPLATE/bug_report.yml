name: Bug report
description: Report something that does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What you expected"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Short steps, or a small program that shows it."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version of the app"
      description: "Settings shows it."
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "Operating system, and Go version if you built the app"
      placeholder: "macOS 15; go1.26"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs or output"
      description: "Remove keys, tokens, names and addresses before pasting."
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: "Before you send"
      options:
        - label: "I searched the existing issues and did not find this one"
          required: true
        - label: "This is not a security problem (those go to the [private report](https://github.com/ciranda-dev/kolo-share-wails3-example/security/advisories/new))"
          required: true
